<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="todo-card" aria-label="To-do application">
        <header class="card-header">
          <h1>To-Do List</h1>
        </header>

        <form id="task-form" novalidate>
          <label class="sr-only" for="task-input">Task description</label>
          <div class="input-row">
            <input
              id="task-input"
              name="task"
              type="text"
              placeholder="Enter a task"
              aria-describedby="task-error"
            />
            <button type="submit">Add</button>
          </div>
          <p id="task-error" class="error-message" aria-live="polite" hidden></p>
        </form>

        <ul id="task-list" class="task-list" aria-live="polite"></ul>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
